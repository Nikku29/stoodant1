# Required checks on every pull request (BACKEND_PLAN.md §6).
# bun only installs packages; every step that runs code uses Node 22.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, unit tests, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx tsc --noEmit
      - name: "Lint (not blocking yet: the repo has existing Prettier errors)"
        run: npx eslint .
        continue-on-error: true
      - run: npx vitest run
      - run: npx vite build
      - run: node scripts/check-bundle.mjs --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/client
          retention-days: 7

  backend:
    name: Rules and function tests (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: functions
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/client
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        working-directory: functions

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/client
      # Performance >= 85 warns for now; accessibility, SEO and best practices fail the check.
      - run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: functions
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview:
    name: Preview channel (staging project)
    runs-on: ubuntu-latest
    needs: [web, backend]
    # Skipped until the staging project and Workload Identity Federation exist (DEPLOY.md: set the repository variable DEPLOY_ENABLED=true).
    if: github.event_name == 'pull_request' && vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      # Previews must never be indexed: add a noindex header to this deploy's hosting config only.
      - run: |
          jq '.hosting.headers[0].headers += [{"key": "X-Robots-Tag", "value": "noindex, nofollow"}]' firebase.json > firebase.preview.json
          mv firebase.preview.json firebase.json
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - id: deploy
        run: |
          npx -y firebase-tools@15.32.1 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --expires 7d --json > deploy.json
          echo "url=$(jq -r '.result[].url' deploy.json | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `Preview (expires in 7 days, not indexed): ${url}` });
