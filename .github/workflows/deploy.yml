# main -> staging automatically, then production after manual approval (BACKEND_PLAN.md §6).
# Hosting, functions, Firestore rules/indexes and Storage rules always deploy together.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    # Skipped until the Firebase projects and Workload Identity Federation exist (DEPLOY.md: set the repository variable DEPLOY_ENABLED=true).
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
    permissions:
      contents: write
      id-token: write

  production:
    # The production environment has a required reviewer, so this waits for your approval.
    needs: staging
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production
    permissions:
      contents: write
      id-token: write
