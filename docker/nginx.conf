# Mirrors vercel.json / firebase.json: clean URLs, no trailing slash, real 404 page, security headers.
# nginx drops server-level add_header lines inside a location that adds its own, so each location includes them.
server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  error_page 404 /404.html;

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri $uri.html $uri/index.html =404;
  }
}
